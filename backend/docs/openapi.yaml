  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: También satisface el cambio obligatorio. Revoca sesiones anteriores
        y entrega un access token nuevo.
      summary: Cambiar contraseña
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              CambioDeContraseña:
                value:
                  current_password: <CONTRASEÑA_ACTUAL>
                  new_password: <NUEVA_CONTRASEÑA_SEGURA>
                  confirm_password: <NUEVA_CONTRASEÑA_SEGURA>
                summary: Cambio de contraseña
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
