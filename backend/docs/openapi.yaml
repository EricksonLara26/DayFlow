openapi: 3.0.3
info:
  title: DayFlow API
  version: 1.0.0
  description: API REST versionada para autenticación, usuarios, catálogos, tickets,
    auditoría y analítica de DayFlow.
paths:
  /api/v1/analytics/activity-history/:
    get:
      operationId: analytics_activity_history_list
      description: Respuesta paginada con cambios auditables de solo lectura.
      summary: Historial global de actividad
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Analytics
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityHistoryList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayFlowError'
              examples:
                NoAutenticado:
                  value:
                    message: Las credenciales de autenticación no se proveyeron.
                    fields: {}
                  summary: No autenticado
          description: JWT ausente, inválido o expirado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayFlowError'
              examples:
                SinPermiso:
                  value:
                    message: No tienes permisos para realizar esta operación.
                    fields: {}
                  summary: Sin permiso
          description: El rol o el estado de la cuenta no permite la operación.
  /api/v1/analytics/annual-technician-report/:
    get:
      operationId: analytics_annual_technician_report_retrieve
      summary: Informe anual de tickets completados por técnico
      parameters:
      - in: query
        name: technician_id
        schema:
          type: integer
        description: ID canónico de un usuario TECHNICIAN.
        required: true
      - in: query
        name: year
        schema:
          type: integer
        description: Año de closed_at entre 2000 y 2100.
        required: true
      tags:
      - Analytics
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnualTechnicianReportResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayFlowError'
              examples:
                Validación:
                  value:
                    message: No se pudo procesar la solicitud.
                    fields:
                      due_date:
                      - La fecha límite no puede ser anterior a la creación.
          description: Solicitud o campos inválidos.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayFlowError'
              examples:
                NoAutenticado:
                  value:
                    message: Las credenciales de autenticación no se proveyeron.
                    fields: {}
                  summary: No autenticado
          description: JWT ausente, inválido o expirado.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayFlowError'
              examples:
                SinPermiso:
                  value:
                    message: No tienes permisos para realizar esta operación.
                    fields: {}
                  summary: Sin permiso
          description: El rol o el estado de la cuenta no permite la operación.
